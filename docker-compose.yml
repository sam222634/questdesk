services:
  db:
    image: postgres:16-alpine
    container_name: tickets_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tickets_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tickets_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-tickets_core}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-tickets_admin} -d $${POSTGRES_DB:-tickets_core}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend_db_net

  core-tickets:
    build:
      context: ./modules/core_tickets
      dockerfile: Dockerfile
    container_name: tickets_core_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tickets_admin}:${POSTGRES_PASSWORD:-tickets_local_dev}@db:5432/${POSTGRES_DB:-tickets_core}
      BITACORAS_DIR: /data/bitacoras
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./modules/core_tickets/app:/app/app
      - ./bitacoras:/data/bitacoras
    networks:
      - backend_db_net
      - frontend_net

  web-ui:
    build:
      context: ./modules/web_ui
      dockerfile: Dockerfile
    container_name: tickets_web_ui
    restart: unless-stopped
    depends_on:
      - core-tickets
    environment:
      CORE_API_URL: http://core-tickets:8000/api/v1
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      - ./modules/web_ui/public:/var/www/html:ro
    networks:
      - frontend_net

volumes:
  postgres_data:

networks:
  backend_db_net:
    driver: bridge
  frontend_net:
    driver: bridge
